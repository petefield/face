services:
  brain:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/blinky-brain:latest
    container_name: blinky-brain

    ports:
      - "5233:8080"

    # Secrets come from a gitignored .env file next to this compose file.
    environment:
      OpenAI__ApiKey: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4o}
      Face__BaseUrl: ${FACE_URL:-http://face:5000}
      Speech__Url: ${SPEECH_URL:-http://voice:5000/speak}
      Mcp__Servers__blinky__Url: http://mcp-server:5555/mcp
      Skills__homeAssistant__BaseUrl: ${HOMEASSISTANT_URL:-http://pippin:8123/}
      Skills__homeAssistant__AccessToken: ${HOMEASSISTANT_TOKEN:-}
      Skills__googleCalendar__ServiceAccountKeyFile: /secrets/googlecalanderkeyfile.json
      Skills__googleCalendar__CalendarId: ${GOOGLE_CALENDAR_ID:-}
      Skills__xweather__ClientId: ${XWEATHER_CLIENT_ID:-}
      Skills__xweather__ClientSecret: ${XWEATHER_CLIENT_SECRET:-}
      Skills__xweather__DefaultLocation: ${XWEATHER_DEFAULT_LOCATION:-London,UK}

    volumes:
      - ${GOOGLE_KEY_FILE:-./googlecalanderkeyfile.json}:/secrets/googlecalanderkeyfile.json:ro,z

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - mcp-server

    restart: unless-stopped

  mcp-server:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/blinky-mcp-server:latest
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: blinky-mcp-server

    ports:
      - "5555:5555"

    environment:
      Face__BaseUrl: ${FACE_URL:-http://face:5000}
      Skills__homeAssistant__BaseUrl: ${HOMEASSISTANT_URL:-http://pippin:8123/}
      Skills__homeAssistant__AccessToken: ${HOMEASSISTANT_TOKEN:-}
      Skills__googleCalendar__ServiceAccountKeyFile: /secrets/googlecalanderkeyfile.json
      Skills__googleCalendar__CalendarId: ${GOOGLE_CALENDAR_ID:-}
      Skills__xweather__ClientId: ${XWEATHER_CLIENT_ID:-}
      Skills__xweather__ClientSecret: ${XWEATHER_CLIENT_SECRET:-}
      Skills__xweather__DefaultLocation: ${XWEATHER_DEFAULT_LOCATION:-London,UK}
      Skills__timers__FilePath: /data/timers.md
      skills__musicAssistant__BaseUrl: "http://192.168.1.69:8095"
      skills__musicAssistant__AccessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyUWVkVU9Gd0RDNXVrYlpPVFFyZWotWkpBTER6OEVpQjZGdVVVb09VZzBjIiwianRpIjoic2FMQy1TOHRpb09LRkFjRzBTVmNkY2JtdVJHam5LVkFISEFGU0E5LVlfYyIsImlhdCI6MTc5MzQ1NjUyOSwiZXhwIjoxODI0OTkyNTI5LCJ1c2VybmFtZSI6InBldGUiLCJyb2xlIjoiYWRtaW4iLCJ0b2tlbl9uYW1lIjoibWNwMiIsImlzX2xvbmdfbGl2ZWQiOnRydWV9.7E3DiDVhapYw5dKcFxgLDBNVWL2PACi7kBZAXffyv48"
      skills__musicAssistant__QueueId": "Study - PC"
    
    volumes:
      - ${GOOGLE_KEY_FILE:-./googlecalanderkeyfile.json}:/secrets/googlecalanderkeyfile.json:ro,z
      - mcp-data:/data

    restart: unless-stopped

  face:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/blinky-face:latest
    build: ./face
    container_name: blinky-face

    ports:
      - "5000:5000"

    # DRM/KMS display and the PCA9685 servo board on I2C. The host display
    # manager must be stopped so the container can become DRM master.
    devices:
      - /dev/dri:/dev/dri
      - /dev/i2c-1:/dev/i2c-1

    # Numeric host gids (video, render, i2c); names don't exist inside the image
    group_add:
      - "44"
      - "105"
      - "994"

    volumes:
      - face-data:/data

    # The image has no curl, so probe /health over bash's built-in TCP support
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    restart: unless-stopped

  voice:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/blinky-voice:latest
    build: ./mouth
    container_name: blinky-voice

    ports:
      - "5060:5000"

    devices:
      - /dev/snd:/dev/snd

    ipc: host

    volumes:
      - ./mouth/voices/:/voices:ro
      - /home/pete/.asoundrc:/etc/asound.conf:ro

    environment:
      PIPER_MODEL: /voices/en_GB-semaine-medium.onnx
      AUDIO_DEVICE: default
      SPEECH_SPEED: "0.85"

    restart: unless-stopped

volumes:
  face-data:
  mcp-data:
