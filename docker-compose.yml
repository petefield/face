services:
  brain:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/robot:latest
    container_name: blinky-brain

    ports:
      - "5233:8080"

    # Secrets come from a gitignored .env file next to this compose file.
    environment:
      OpenAI__ApiKey: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4o}
      Face__BaseUrl: ${FACE_URL:-http://face:5000}
      Speech__Url: ${SPEECH_URL:-http://voice:5000/speak}
      Skills__homeAssistant__BaseUrl: ${HOMEASSISTANT_URL:-http://pippin:8123/}
      Skills__homeAssistant__AccessToken: ${HOMEASSISTANT_TOKEN:-}
      Skills__googleCalendar__ServiceAccountKeyFile: /secrets/googlecalanderkeyfile.json
      Skills__googleCalendar__CalendarId: ${GOOGLE_CALENDAR_ID:-}
      Skills__xweather__ClientId: ${XWEATHER_CLIENT_ID:-}
      Skills__xweather__ClientSecret: ${XWEATHER_CLIENT_SECRET:-}
      Skills__xweather__DefaultLocation: ${XWEATHER_DEFAULT_LOCATION:-London,UK}

    volumes:
      - ${GOOGLE_KEY_FILE:-./googlecalanderkeyfile.json}:/secrets/googlecalanderkeyfile.json:ro,z

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

  face:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/blinky-face:latest
    build: ./face
    container_name: blinky-face

    ports:
      - "5000:5000"

    # DRM/KMS display and the PCA9685 servo board on I2C. The host display
    # manager must be stopped so the container can become DRM master.
    devices:
      - /dev/dri:/dev/dri
      - /dev/i2c-1:/dev/i2c-1

    # Numeric host gids (video, render, i2c); names don't exist inside the image
    group_add:
      - "44"
      - "105"
      - "994"

    volumes:
      - face-data:/data

    restart: unless-stopped

  voice:
    build: ./mouth
    container_name: blinky-voice

    ports:
      - "5060:5000"

    devices:
      - /dev/snd:/dev/snd

    ipc: host

    volumes:
      - ./mouth/voices/:/voices:ro
      - /home/pete/.asoundrc:/etc/asound.conf:ro

    environment:
      PIPER_MODEL: /voices/en_GB-semaine-medium.onnx
      AUDIO_DEVICE: default
      SPEECH_SPEED: "0.85"

    restart: unless-stopped

volumes:
  face-data:
