
services:
  piper:
    build: .
    container_name: piper-tts

    ports:
      - "5060:5000"

    devices:
      - /dev/snd:/dev/snd

    ipc: host

    volumes:
      - ./voices:/voices:ro
      - /home/pete/.asoundrc:/etc/asound.conf:ro

    environment:
      PIPER_MODEL: /voices/en_GB-semaine-medium.onnx
      AUDIO_DEVICE: default
      SPEECH_SPEED: "0.85"

    restart: unless-stopped
